# Custom Pongo dependency: a mock "external service" for the integration tests.
#
# Pongo starts it because `.pongo/pongorc` contains `--httpbin`. Inside the test
# network it is reachable as http://httpbin:8080 (the service name below).
# Endpoints: /uuid, /anything, /status/<code>, /delay/<seconds>, ...
# (see https://github.com/mccutchen/go-httpbin)
#
# To add your own mock (WireMock, Keycloak, Redis, ...): copy this file to
# .pongo/<name>.yml, use <name> as the service name, and add `--<name>` to
# .pongo/pongorc (or `--no-<name>` to only start it with `pongo up --<name>`).

services:
  httpbin:                                          # must equal the name in pongorc
    image: mccutchen/go-httpbin:${HTTPBIN:-2.25.0}  # override with HTTPBIN=<tag>
    # go-httpbin is a minimal (distroless) image without shell/curl, so it can't
    # have a healthcheck; Pongo then assumes it is healthy. It starts in well
    # under a second. Slower services should get a healthcheck, for example:
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10
    restart: on-failure
    stop_signal: SIGKILL
    networks:
      - ${NETWORK_NAME}
